name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'backend/**'
      - '.github/workflows/ci.yml'

jobs:
  test:
    runs-on: self-hosted
    environment: staging
    env:
      RAILS_ENV: test
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            backend
            .github/workflows

      - name: Install Ruby dependencies
        run: |
          bundle config set jobs 4
          bundle check || bundle install

      - name: Run RuboCop
        run: bin/rubocop --parallel

      - name: Run ERB Lint
        run: bin/erb_lint --lint-all

      - name: Setup database
        run: bin/rails db:test:prepare

      - name: Run tests
        run: bin/rails test
